name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint:check
            - run: pnpm build
            - run: pnpm typecheck
            - run: pnpm test:unit

    integration:
        runs-on: ubuntu-latest
        needs: check
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm test:integration

    # Runs only on pushes to main, and only after check + integration pass.
    # With pending changesets it opens/updates the "Version Packages" PR;
    # when that PR is merged it publishes to npm.
    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [check, integration]
        runs-on: ubuntu-latest
        concurrency:
            group: release-${{ github.ref }}
            cancel-in-progress: false
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - uses: changesets/action@v1
              with:
                  publish: pnpm release
                  version: pnpm version-packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
